<svg width="1280" height="400" viewBox="0 0 1280 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="third-rail: safe changes to the code everyone is afraid to touch">
  <defs>
    <style>
      .mono { font-family: "JetBrains Mono", "SF Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    </style>
    <filter id="glow" x="-50%" y="-400%" width="200%" height="900%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1280" height="400" rx="16" fill="#ffffff"/>
  <rect x="0.5" y="0.5" width="1279" height="399" rx="15.5" fill="none" stroke="#d0d7de"/>

  <!-- wordmark -->
  <text x="96" y="150" class="mono" font-size="64" font-weight="700" fill="#1f2328" letter-spacing="-2">third-rail</text>
  <text x="96" y="196" class="mono" font-size="22" fill="#656d76">Safe changes to the code everyone is afraid to touch.</text>

  <!-- component chips -->
  <g class="mono" font-size="14">
    <rect x="96" y="228" width="186" height="34" rx="17" fill="none" stroke="#d0d7de"/>
    <text x="118" y="250" fill="#9a6700">deterministic hook</text>
    <rect x="298" y="228" width="132" height="34" rx="17" fill="none" stroke="#d0d7de"/>
    <text x="320" y="250" fill="#0550ae">org runbook</text>
    <rect x="446" y="228" width="196" height="34" rx="17" fill="none" stroke="#d0d7de"/>
    <text x="468" y="250" fill="#1a7f37">blast-radius agent</text>
  </g>

  <!-- rails: two ordinary, the third electrified -->
  <g>
    <rect x="0" y="308" width="1280" height="4" fill="#eaeef2"/>
    <rect x="0" y="330" width="1280" height="4" fill="#eaeef2"/>
    <rect x="0" y="352" width="1280" height="5" fill="#bf8700" filter="url(#glow)" opacity="0.95"/>
    <g class="mono" font-size="13">
      <rect x="1024" y="341" width="160" height="27" rx="6" fill="#ffffff" stroke="#bf8700"/>
      <text x="1040" y="359" fill="#9a6700">600V &#183; guarded</text>
    </g>
  </g>
</svg>
